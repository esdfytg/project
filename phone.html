<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Телефон — Экран</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.25s ease;
    }
    header {
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #10b981;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    main {
      padding: 24px 20px;
      flex: 1;
    }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { font-size: 17px; line-height: 1.6; white-space: pre-wrap; margin: 0; }
    .meta { margin-top: 24px; font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <input id="roomInput" value="demo-room-1" placeholder="Код комнаты" />
    <button id="connectBtn">Подключить</button>
  </header>

  <main>
    <h1 id="viewTitle">Ожидание данных с ПК...</h1>
    <p id="viewText">Убедитесь, что на ПК открыта эта же комната.</p>
    <div class="meta" id="meta">Статус: подключение...</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForRealtimeDatabase12345",
      databaseURL: "https://project-19eb5-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const roomInput = document.getElementById("roomInput");
    const connectBtn = document.getElementById("connectBtn");
    const viewTitle = document.getElementById("viewTitle");
    const viewText = document.getElementById("viewText");
    const meta = document.getElementById("meta");

    let currentRef = null;

    function subscribeRoom() {
      const room = (roomInput.value || "default").trim();
      if (currentRef) off(currentRef);

      currentRef = ref(db, "rooms/" + room);
      meta.textContent = "Подключено к комнате: " + room;

      onValue(currentRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          viewTitle.textContent = "Комната пуста";
          viewText.textContent = "Измените текст на ПК в комнате «" + room + "».";
          return;
        }
        viewTitle.textContent = data.title || "";
        viewText.textContent = data.text || "";
        if (data.theme) document.body.style.background = data.theme;
        if (data.updatedAt) {
          meta.textContent = "Обновлено: " + new Date(data.updatedAt).toLocaleTimeString();
        }
      });
    }

    connectBtn.addEventListener("click", subscribeRoom);
    subscribeRoom();
  </script>
</body>
</html>
